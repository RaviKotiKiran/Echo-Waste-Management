name: Build Echo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    container: maven:3.9.11-eclipse-temurin-17
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: mvn --batch-mode verify
