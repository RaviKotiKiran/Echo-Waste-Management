spring.application.name=echo-waste
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/echo_waste;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
server.port=${PORT:8081}
# Local-development default only; the prod profile requires JWT_SECRET.
app.jwt.secret=${JWT_SECRET:echo-waste-application-default-secret-key-32-chars!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
server.error.include-message=never
