# MySQL is the application's only database. Configure DB_URL, DB_USER and DB_PASSWORD as needed.
app.jwt.secret=local-only-echo-development-key-please-change-before-deployment
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Local databases predate versioned migrations; Hibernate updates them in development.
spring.flyway.enabled=false
